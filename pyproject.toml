[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-multitrajectory"
version = "0.1.0"
description = "Fixed-budget multi-trajectory coverage and train-only reference assignment"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.4,<2.10", "numpy>=1.24,<3", "pydantic>=2,<3", "einops>=0.8,<0.9"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
