name: GRU CPU
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/latent_multi/gru/**'
      - 'configs/gru/**'
      - 'tests/test_gru_portable.py'
      - 'tests/test_gru_statistics.py'
      - 'pyproject.toml'
      - 'examples/gru_smoke.py'
      - '.github/workflows/gru-cpu.yml'
permissions:
  contents: read
jobs:
  gru:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU package
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: New GRU tests only
        run: python -m pytest -q tests/test_gru_portable.py tests/test_gru_statistics.py
      - name: Synthetic untrained interface
        run: python examples/gru_smoke.py --out outputs/gru_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gru-synthetic-smoke
          path: outputs/gru_smoke/
