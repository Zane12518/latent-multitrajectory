name: CPU reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install public package
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Tests and public documents
        run: |
          python -m pytest -q
          python scripts/check_public.py --links
      - name: Short training, full-state recovery, inference and Demo
        run: |
          python training/train.py --config configs/cpu_smoke.json --data data/toy.json --arm set --out outputs/toy_train
          python training/train.py --config configs/cpu_smoke.json --data data/toy.json --resume outputs/toy_train/step00002.pt --arm set --updates 1 --out outputs/toy_resume
          python evaluation/evaluate.py --config configs/cpu_smoke.json --data data/toy.json --checkpoint outputs/toy_train/step00002.pt --repeats 1 --limit 2 --out outputs/toy_eval
          python examples/replay.py --out outputs/replay.html
      - name: Public historical asset readback (no new scientific training)
        run: |
          curl --fail --location --retry 2 https://github.com/Zane12518/latent-multitrajectory/releases/download/v0.1.0/latent-multitrajectory-assets.tar.gz -o assets.tar.gz
          tar -xzf assets.tar.gz
          python scripts/verify_assets.py release_assets
          python evaluation/reproduce_table.py --metrics release_assets/statistics/metrics.npz --out outputs/table_readback.json
          python evaluation/evaluate.py --config configs/cpu_smoke.json --data data/demo_inputs.json --checkpoint release_assets/weights/c1301_1511_set.pt --repeats 1 --limit 2 --out outputs/checkpoint_cpu
      - name: Retain CPU validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-validation
          path: |
            outputs/**/*.json
            outputs/replay.html
          if-no-files-found: warn
